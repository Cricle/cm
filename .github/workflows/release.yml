name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          SUFFIX="${RUNNER_OS}-${RUNNER_ARCH}"
          if [ -f target/release/cm ]; then
            NAME="cm-${VERSION}-${SUFFIX}"
            cp target/release/cm "dist/${NAME}"
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "dist/${NAME}" > "dist/${NAME}.sha256"; else shasum -a 256 "dist/${NAME}" > "dist/${NAME}.sha256"; fi
          else
            NAME="cm-${VERSION}-${SUFFIX}.exe"
            cp target/release/cm.exe "dist/${NAME}"
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "dist/${NAME}" > "dist/${NAME}.sha256"; else shasum -a 256 "dist/${NAME}" > "dist/${NAME}.sha256"; fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cm-${{ runner.os }}-${{ runner.arch }}
          path: dist/*

  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
